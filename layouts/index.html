{{/* Overrides themes/wellington/layouts/index.html so the home page uses the
     project's all-posts partial (hero card + cover banners + pagination)
     instead of the theme's own inline post loop. */}}
{{ define "main" }}
<section id="primary" class="content-archive content-area">
    {{ partial "all-posts.html" . }}
</section>

<section id="secondary" class="sidebar widget-area clearfix" role="complementary">
    {{ partial "sidebar.html" . }}
</section>
{{ end }}
