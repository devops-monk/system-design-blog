baseURL = "https://system-design.devops-monk.com/"
languageCode = "en-us"
title = "System Design"
theme = "wellington"
paginate=10

[outputs]
  home = ["HTML", "RSS", "JSON"]

disqusShortname = ""
googleAnalytics = ""
enableRobotsTXT = true
preserveTaxonomyNames = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "nord"
    codeFences = true
    lineNos = false
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[taxonomies]
  category = "categories"
  tag = "tags"

[Params.widgets]
    search = true
    recent_articles = true
    recent_articles_num = 5
    categories = true
    tags = true
    tags_counter = false

